name: PrivatePresenter
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
packages:
  TeleprompterCore:
    path: Packages/TeleprompterCore
  PhoneLibrary:
    path: Packages/PhoneLibrary
  PrototypeSupport:
    path: iPhonePrototype/Support
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
targets:
  PrivatePresenter:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: PrivatePresenterApp
    info:
      path: PrivatePresenterApp/Info.plist
      properties:
        CFBundleDisplayName: Private Presenter
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: PrivatePresenterApp/Resources/PrivatePresenter.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatepresenter.teleprompter
        PRODUCT_NAME: Private Presenter
        PRODUCT_MODULE_NAME: PrivatePresenter
        CODE_SIGN_ENTITLEMENTS: PrivatePresenterApp/Resources/PrivatePresenter.entitlements
    dependencies:
      - package: TeleprompterCore
        product: TeleprompterCore
      - sdk: Carbon.framework
  PrivatePresenterAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: PrivatePresenterAppTests
    dependencies:
      - target: PrivatePresenter
      - package: TeleprompterCore
        product: TeleprompterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatepresenter.teleprompter.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Private Presenter.app/Contents/MacOS/Private Presenter
  PrivatePresenterUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: PrivatePresenterUITests
    dependencies:
      - target: PrivatePresenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatepresenter.teleprompter.uitests
  TeleprompterPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iPhoneApp
      - path: iPhonePrototype/App
        excludes: [PrototypeEntry.swift, Info.plist]
    info:
      path: iPhoneApp/Info.plist
      properties:
        CFBundleDisplayName: teleprompterpal.com
        CFBundleShortVersionString: 0.6.12
        CFBundleVersion: "32"
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Record a video while reading your script.
        NSMicrophoneUsageDescription: Include your voice in a recorded take.
        NSPhotoLibraryAddUsageDescription: Save a video you choose to your Photos library.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text Script
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secondwind.teleprompter.prototype
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: TeleprompterCore
        product: PromptingCore
      - package: PhoneLibrary
      - package: PrototypeSupport
  TeleprompterPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iPhoneAppTests
        excludes: [Resources]
      - path: iPhoneAppTests/Resources
        buildPhase: resources
    dependencies:
      - target: TeleprompterPhone
      - package: PhoneLibrary
      - package: TeleprompterCore
        product: PromptingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secondwind.teleprompter.phone.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # Xcode 27 StoreKitTest's public C header itself refers to deprecated SKPaymentTransactionState.
        # Keep Swift/app warnings strict; allow that SDK header warning in the test target only.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-error=deprecated-declarations"
  TeleprompterPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iPhoneUITests
      - path: iPhoneAppTests/Resources
        buildPhase: resources
    dependencies:
      - target: TeleprompterPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.secondwind.teleprompter.phone.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-error=deprecated-declarations"
schemes:
  PrivatePresenter:
    shared: true
    build:
      targets:
        PrivatePresenter: all
        PrivatePresenterAppTests: [test]
        PrivatePresenterUITests: [test]
    test:
      targets:
        - PrivatePresenterAppTests
        - PrivatePresenterUITests
  TeleprompterPhone:
    shared: true
    build:
      targets:
        TeleprompterPhone: all
    test:
      targets:
        - name: TeleprompterPhoneTests
          skippedTests: [SubscriptionStoreKitTests]
        - name: TeleprompterPhoneUITests
          skippedTests: [P5BSubscriptionFlowTests, P5CSubscriptionPolicyFlowTests, P5DLocalEventFlowTests]
  TeleprompterPhone-P5:
    shared: true
    build:
      targets:
        TeleprompterPhone: all
    run:
      config: Debug
      storeKitConfiguration: iPhoneAppTests/Resources/TeleprompterLocal.storekit
      commandLineArguments:
        "--p5-local-paywall": true
      environmentVariables:
        TELEPROMPTER_LOCAL_STOREKIT_TEST: "1"
    test:
      environmentVariables:
        TELEPROMPTER_LOCAL_STOREKIT_TEST: "1"
      targets:
        - TeleprompterPhoneTests
        - TeleprompterPhoneUITests
